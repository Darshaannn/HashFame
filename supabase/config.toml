project_id = "ggs-foundation"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "com.ggs.mobile.local://auth/callback"
additional_redirect_urls = ["com.ggs.mobile.local://auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
[functions.request-deletion]
verify_jwt = false
# Function validates the bearer through Auth.getUser before any database call.
